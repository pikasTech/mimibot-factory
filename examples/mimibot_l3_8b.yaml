### model
model_name_or_path: /root/autodl-fs/models/Llama3.1-8B-Chinese-Chat
# model_name_or_path: output/mimibot_l3.1_8b_chinese_chat_cot_v0.4
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: all
# finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: mimibot_alpaca_data_processed, alpaca_data_processed
template: llama3
cutoff_len: 512
max_samples: 8192
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /root/autodl-fs/saves/mimibot_l3_v1.0
logging_steps: 1
save_steps: 650
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 8
ddp_find_unused_parameters: false
gradient_accumulation_steps: 2
optim: paged_adamw_32bit
# learning_rate: 1.0e-4 # v0.9
learning_rate: 2.0e-4 # v1.0
gradient_checkpointing: false
disable_gradient_checkpointing: true
save_strategy: 'no'
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true 
ddp_timeout: 180000000
# resume_from_checkpoint: true

### eval
val_size: 0.1
per_device_eval_batch_size: 32
eval_strategy: steps
eval_steps: 100
